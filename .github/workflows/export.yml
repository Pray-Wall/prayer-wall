# Weekly database export, encrypted, kept for 7 days as a run artifact. See docs/runbook.md, "Database export".
# The export holds request text, so it is encrypted with the EXPORT_PASSPHRASE secret before it leaves the job.
name: Database export
on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check the passphrase is set
        env:
          EXPORT_PASSPHRASE: ${{ secrets.EXPORT_PASSPHRASE }}
        run: |
          if [ -z "$EXPORT_PASSPHRASE" ]; then echo "::error::Set the EXPORT_PASSPHRASE secret first (docs/runbook.md)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 export prayer-wall --remote --output "$RUNNER_TEMP/export.sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Encrypt and remove the plain copy
        env:
          EXPORT_PASSPHRASE: ${{ secrets.EXPORT_PASSPHRASE }}
        run: |
          name="prayer-wall-$(date -u +%Y-%m-%d).sql.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output "$RUNNER_TEMP/$name" "$RUNNER_TEMP/export.sql" 3<<<"$EXPORT_PASSPHRASE"
          shred -u "$RUNNER_TEMP/export.sql"
          echo "EXPORT_FILE=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: database-export
          path: ${{ env.EXPORT_FILE }}
          retention-days: 7
