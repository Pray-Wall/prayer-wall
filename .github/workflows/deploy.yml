name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Schema first, so the new code never runs against an old database.
      - run: npx wrangler d1 migrations apply prayer-wall --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # GIT_SHA makes the footer link to the exact source that is running (AGPL).
      - run: npx wrangler deploy --var GIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The master secret keys the daily visitor hashes. It is generated here once, so that
      # no person and no other machine ever sees it. Losing it only resets those hashes.
      - name: Create MASTER_SECRET if it does not exist
        run: |
          secrets="$(npx wrangler secret list)"
          case "$secrets" in
            *MASTER_SECRET*) echo "MASTER_SECRET already set" ;;
            *) openssl rand -hex 32 | npx wrangler secret put MASTER_SECRET ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
